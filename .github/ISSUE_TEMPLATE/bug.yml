name: Bug
description: A script crashed, output is broken, or a skill behaved wrongly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: {required: true}
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, how you installed
      placeholder: macOS 15, Python 3.9, ./install.sh
    validations: {required: true}
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Never paste secrets.
      render: text
